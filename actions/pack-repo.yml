########################################################################
#  GitHub Lens Ultra — heavy-work helper
#
#  Cloudflare Workers cannot hold a multi-gigabyte archive in memory, so
#  the bot delegates "pack 2 GB repo into Telegram-sized 7z parts" to this
#  workflow. The bot dispatches it via `repository_dispatch: pack-repo`
#  and then sends the user a message with the resulting links.
#
#  Put this file in a separate (usually private) repo, e.g. `you/ghlens-jobs`
#  and set HELPER_REPO=you/ghlens-jobs + HELPER_REPO_TOKEN in the Worker.
########################################################################
name: pack-repo

on:
  repository_dispatch:
    types: [pack-repo]
  workflow_dispatch:
    inputs:
      full:
        description: "owner/repo"
        required: true
      ref:
        description: "branch / tag / sha"
        required: false
        default: ""
      job_id:
        description: "job id returned by the bot"
        required: false
        default: "manual"

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 350          # GitHub's hard ceiling is 6h
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: "1", dummy: "1" }

    steps:
      - name: Resolve payload
        id: p
        run: |
          FULL="${{ github.event.client_payload.full || github.event.inputs.full }}"
          REF="${{ github.event.client_payload.ref || github.event.inputs.ref }}"
          JOB="${{ github.event.client_payload.job_id || github.event.inputs.job_id }}"
          [ -z "$REF" ] && REF=$(curl -s "https://api.github.com/repos/$FULL" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" | jq -r .default_branch)
          echo "full=$FULL" >> $GITHUB_OUTPUT
          echo "ref=$REF"   >> $GITHUB_OUTPUT
          echo "job=$JOB"   >> $GITHUB_OUTPUT
          echo "safe=$(echo "$FULL-$REF" | tr '/:' '__')" >> $GITHUB_OUTPUT

      - name: Free up disk space (this is why it works here and nowhere else)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Download source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FULL="${{ steps.p.outputs.full }}"
          REF="${{ steps.p.outputs.ref }}"
          echo "downloading $FULL@$REF …"
          curl -L --fail --retry 3 -o src.tar.gz \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://codeload.github.com/$FULL/tar.gz/$REF"
          ls -lh src.tar.gz

      - name: Split into 7z parts (Telegram-friendly, ~1.9 GB each)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          7z a -v1900m -mx1 "pack-${{ steps.p.outputs.safe }}.7z" src.tar.gz
          ls -lh pack-*.7z
          sha256sum pack-*.7z > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release with the parts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pack/${{ steps.p.outputs.safe }}-${{ github.run_id }}
          name: "📦 ${{ steps.p.outputs.full }} @ ${{ steps.p.outputs.ref }}"
          body: |
            Auto-packed by **GitHub Lens Ultra** for job `${{ steps.p.outputs.job }}`.

            **How to restore**
            ```bash
            cat pack-*.7z.* > pack.7z
            7z x pack.7z            # → src.tar.gz
            tar -xzf src.tar.gz
            ```
            Verify integrity with `sha256sum -c SHA256SUMS.txt`.
          files: |
            pack-*.7z*
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report back to the bot
        if: ${{ secrets.BOT_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "${{ secrets.BOT_WEBHOOK_URL }}/api/job-done" \
            -H "content-type: application/json" \
            -d '{
              "job_id": "${{ steps.p.outputs.job }}",
              "repo": "${{ steps.p.outputs.full }}",
              "ref": "${{ steps.p.outputs.ref }}",
              "release": "https://github.com/${{ github.repository }}/releases/tag/pack/${{ steps.p.outputs.safe }}-${{ github.run_id }}"
            }'
