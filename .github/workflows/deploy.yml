name: Deploy to Cloudflare Workers

# Push to main → tests → deploy → smoke-test the live worker.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  – token with "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID – your account id
# Optional:
#   TELEGRAM_WEBHOOK_SECRET – enables the deep-health smoke test after deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck + tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping the deploy steps. Add it under Settings → Secrets and variables → Actions to enable automatic deployment."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke test (/health)
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -euo pipefail
          URL=$(grep -oE '"WORKER_URL"[[:space:]]*:[[:space:]]*"[^"]+"' wrangler.jsonc | head -1 | sed -E 's/.*"(https[^"]+)"/\1/')
          echo "checking $URL/health"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "$URL/health" || true)
            [ "$code" = "200" ] && break
            echo "attempt $i returned $code, retrying…"
            sleep 5
          done
          cat /tmp/health.json
          python3 -c "import json; d=json.load(open('/tmp/health.json')); assert d['ok'], d; print('health ok, storage backend:', d['bindings']['storage_backend'])"

      - name: Deep health (D1, KV, Telegram, GitHub, AI, embeddings, queue, DO)
        if: steps.creds.outputs.ready == 'true'
        env:
          TG_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${TG_SECRET:-}" ]; then
            echo "TELEGRAM_WEBHOOK_SECRET is not set — skipping the deep probe"
            exit 0
          fi
          URL=$(grep -oE '"WORKER_URL"[[:space:]]*:[[:space:]]*"[^"]+"' wrangler.jsonc | head -1 | sed -E 's/.*"(https[^"]+)"/\1/')
          curl -s "$URL/health?deep=$TG_SECRET" | tee /tmp/deep.json
          python3 -c "import json; d=json.load(open('/tmp/deep.json')); print('pass:', d['pass']); [print(' ', k, v.get('ok')) for k, v in d['checks'].items()]"

      - name: Cron heartbeat (proves the scheduler is wired)
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -euo pipefail
          URL=$(grep -oE '"WORKER_URL"[[:space:]]*:[[:space:]]*"[^"]+"' wrangler.jsonc | head -1 | sed -E 's/.*"(https[^"]+)"/\1/')
          curl -s "$URL/health?cron=1" | tee /tmp/cron.json
          echo "note: the first heartbeat appears after the next scheduled run"
